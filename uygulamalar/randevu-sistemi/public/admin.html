<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Paneli — Randevu Listesi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>Admin Paneli</h1>
      <p class="subtitle">Günlük randevu listesi</p>
      <nav class="tabs">
        <a href="index.html" class="tab">Yeni Randevu</a>
        <a href="admin.html" class="tab active">Admin Paneli</a>
      </nav>
    </header>

    <main>
      <section class="card">
        <div class="admin-controls">
          <div class="form-row">
            <label for="filterDate">Gün Seç</label>
            <input type="date" id="filterDate">
          </div>
          <button id="refreshBtn" class="btn btn-secondary">Güncelle</button>
        </div>

        <div class="summary" id="summary"></div>

        <div class="appointment-list" id="appointmentList">
          <p>Yükleniyor...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Numex Randevu Sistemi — yönetim paneli</p>
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
