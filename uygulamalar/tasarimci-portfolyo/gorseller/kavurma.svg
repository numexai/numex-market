<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Kavurma Kahve Roastery etiket serisi">
  <rect width="640" height="480" fill="#f4efe6"/>
  <rect x="0" y="0" width="640" height="480" fill="#ece4d7"/>
  <!-- fincan formu -->
  <circle cx="470" cy="200" r="118" fill="#7d2b4e"/>
  <circle cx="470" cy="200" r="86" fill="none" stroke="#f4efe6" stroke-width="2"/>
  <!-- etiket kartları -->
  <g transform="rotate(-6 200 250)">
    <rect x="70" y="120" width="180" height="240" rx="6" fill="#fffdf9" stroke="#211a1f" stroke-width="2"/>
    <rect x="86" y="140" width="48" height="6" fill="#211a1f"/>
    <text x="86" y="196" font-family="Georgia, serif" font-size="30" fill="#211a1f">KAVURMA</text>
    <text x="86" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#7d2b4e">SINGLE ORIGIN</text>
    <line x1="86" y1="240" x2="234" y2="240" stroke="#211a1f" stroke-width="1" opacity=".35"/>
    <text x="86" y="262" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6a5f66">ETİYOPYA · 1.900 M</text>
    <text x="86" y="280" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6a5f66">AÇIK KAVURMA</text>
    <circle cx="215" cy="322" r="18" fill="#d9a441"/>
  </g>
  <g transform="rotate(6 400 300)">
    <rect x="252" y="150" width="150" height="210" rx="6" fill="#7d2b4e"/>
    <text x="272" y="212" font-family="Georgia, serif" font-size="22" fill="#f4efe6">KAVURMA</text>
    <text x="272" y="236" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="2.5" fill="#d9a441">KOLOMBİYA</text>
    <line x1="272" y1="252" x2="382" y2="252" stroke="#f4efe6" stroke-width="1" opacity=".5"/>
    <text x="272" y="274" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#f4efe6" opacity=".8">1.750 M · ORTA</text>
    <circle cx="360" cy="330" r="14" fill="#f4efe6"/>
  </g>
  <!-- kahve çekirdeği -->
  <g fill="#211a1f" opacity=".85">
    <ellipse cx="96" cy="418" rx="15" ry="10" transform="rotate(-22 96 418)"/>
    <ellipse cx="136" cy="430" rx="15" ry="10" transform="rotate(14 136 430)"/>
    <ellipse cx="176" cy="414" rx="15" ry="10" transform="rotate(-8 176 414)"/>
  </g>
</svg>
