<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Numex Kütüphanesi — 3B Gezinti</title>
<style>
  /* TEMA — tek yerden değişir */
  :root{
    --zemin: #2b2118;
    --panel: rgba(38, 27, 19, 0.88);
    --panel-kenar: rgba(214, 173, 108, 0.35);
    --vurgu: #d9a441;
    --metin: #f3e7d3;
    --metin-soluk: #b9a98f;
    --radius: 10px;
    --bosluk: clamp(10px, 2vw, 18px);
    --yazi: "Georgia", "Times New Roman", serif;
    --yazi-ui: "Segoe UI", system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--zemin);
    color: var(--metin);
    font-family: var(--yazi-ui);
    overflow: hidden;
  }

  #sahne{
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #sahne:active{ cursor: grabbing; }

  /* --- ÜST BAŞLIK --- */
  .baslik{
    position: fixed;
    top: var(--bosluk);
    left: var(--bosluk);
    max-width: min(92vw, 420px);
    background: var(--panel);
    border: 1px solid var(--panel-kenar);
    border-radius: var(--radius);
    padding: clamp(10px, 1.8vw, 16px) clamp(12px, 2vw, 20px);
    backdrop-filter: blur(6px);
    pointer-events: none;
    z-index: 5;
  }
  .baslik h1{
    margin: 0 0 4px;
    font-family: var(--yazi);
    font-size: clamp(15px, 2.4vw, 21px);
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--metin);
  }
  .baslik p{
    margin: 0;
    font-size: clamp(11px, 1.5vw, 13px);
    line-height: 1.45;
    color: var(--metin-soluk);
  }
  .baslik .rozet{
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    border: 1px solid var(--vurgu);
    border-radius: 999px;
    font-size: clamp(10px, 1.3vw, 11px);
    color: var(--vurgu);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* --- KONTROL PANELİ (dokunmatik + mobil için) --- */
  .kontroller{
    position: fixed;
    bottom: var(--bosluk);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: clamp(6px, 1.2vw, 12px);
    background: var(--panel);
    border: 1px solid var(--panel-kenar);
    border-radius: var(--radius);
    padding: clamp(6px, 1.2vw, 10px);
    backdrop-filter: blur(6px);
    z-index: 6;
    max-width: 95vw;
  }
  .kontroller button{
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    border: 1px solid var(--panel-kenar);
    border-radius: 8px;
    background: transparent;
    color: var(--metin);
    font-family: var(--yazi-ui);
    font-size: clamp(12px, 1.6vw, 14px);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
    white-space: nowrap;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .kontroller button:hover{ background: rgba(217,164,65,.14); }
  .kontroller button.aktif{
    background: var(--vurgu);
    border-color: var(--vurgu);
    color: #2b2118;
    font-weight: 600;
  }
  .kontroller .ayrac{
    width: 1px;
    align-self: stretch;
    background: var(--panel-kenar);
    margin: 4px 2px;
  }
  /* Yön tuşları: mobilde 3x3 düzen */
  .yon-takimi{
    display: grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap: 4px;
  }
  .yon-takimi button{
    min-width: 44px;
    min-height: 44px;
    height: 44px;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .yon-takimi .bos{ visibility: hidden; }

  /* --- İPUCU KUTUSU (kitap yakınında) --- */
  #ipucu{
    position: fixed;
    bottom: calc(var(--bosluk) + 120px);
    left: 50%;
    transform: translate(-50%, 12px);
    background: var(--panel);
    border: 1px solid var(--vurgu);
    border-radius: var(--radius);
    padding: 10px 16px;
    max-width: min(90vw, 480px);
    text-align: center;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events: none;
    z-index: 6;
  }
  #ipucu.gorunur{
    opacity: 1;
    transform: translate(-50%, 0);
  }
  #ipucu .kitap-adi{
    font-family: var(--yazi);
    font-size: clamp(13px, 2vw, 17px);
    color: var(--metin);
    display: block;
    margin-bottom: 2px;
  }
  #ipucu .kitap-alt{
    font-size: clamp(10px, 1.4vw, 12px);
    color: var(--metin-soluk);
    letter-spacing: 0.04em;
  }

  /* --- YÜKLEME PERDESİ --- */
  #perde{
    position: fixed;
    inset: 0;
    background: var(--zemin);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 50;
    transition: opacity .6s ease;
  }
  #perde.gizle{ opacity: 0; pointer-events: none; }
  #perde .sembol{
    width: 46px; height: 46px;
    border: 2px solid rgba(217,164,65,.22);
    border-top-color: var(--vurgu);
    border-radius: 50%;
    animation: don 1s linear infinite;
  }
  @keyframes don{ to{ transform: rotate(360deg); } }
  #perde p{
    margin: 0;
    font-size: clamp(12px, 1.8vw, 14px);
    color: var(--metin-soluk);
    letter-spacing: 0.08em;
  }

  /* --- KÜÇÜK EKRAN --- */
  @media (max-width: 720px){
    .baslik{ max-width: calc(100vw - 2 * var(--bosluk)); }
    .baslik p{ display: none; }
    .kontroller{ gap: 6px; }
    .kontroller .klavye-ipucu{ display: none; }
    #ipucu{ bottom: calc(var(--bosluk) + 170px); }
  }
  @media (max-height: 520px){
    .baslik p, .baslik .rozet{ display: none; }
    #ipucu{ bottom: calc(var(--bosluk) + 160px); }
  }
</style>
</head>
<body>

<canvas id="sahne"></canvas>

<div class="baslik">
  <h1>Numex Kütüphanesi</h1>
  <p>Raflar arasında yürüyün, kitaplara yaklaşın, sırtlarındaki adları okuyun.</p>
  <span class="rozet">3B Gezinti</span>
</div>

<div id="ipucu">
  <span class="kitap-adi"></span>
  <span class="kitap-alt"></span>
</div>

<div class="kontroller">
  <button id="btn-gez" class="aktif" type="button">Gezinme</button>
  <div class="ayrac"></div>
  <div class="yon-takimi">
    <button class="bos" aria-hidden="true"></button>
    <button data-tus="w" aria-label="İleri">▲</button>
    <button class="bos" aria-hidden="true"></button>
    <button data-tus="a" aria-label="Sola">◀</button>
    <button data-tus="s" aria-label="Geri">▼</button>
    <button data-tus="d" aria-label="Sağa">▶</button>
    <button class="bos" aria-hidden="true"></button>
    <button data-tus="bosluk" aria-label="Işık">✦</button>
    <button class="bos" aria-hidden="true"></button>
  </div>
  <div class="ayrac"></div>
  <span class="klavye-ipucu" style="font-size:12px;color:var(--metin-soluk)">W A S D · Sürükle: bak</span>
</div>

<div id="perde">
  <div class="sembol"></div>
  <p>KÜTÜPHANE HAZIRLANIYOR</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* =========================================================
   NUMEX KÜTÜPHANESİ — 3B GEZİNTİ
   Tasarım kararı: sıcak ahşap + kehribar ışık, klasik kütüphane
   ========================================================= */

const canvas = document.getElementById('sahne');

const sahne = new THREE.Scene();
sahne.background = new THREE.Color(0x1d1610);
sahne.fog = new THREE.Fog(0x1d1610, 18, 46);

const kamera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 200);
kamera.position.set(0, 1.65, 16);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

/* ---------- MALZEMELER ---------- */
const MALZEME = {
  ahşapKoyu : new THREE.MeshStandardMaterial({ color: 0x4a3220, roughness: 0.75, metalness: 0.05 }),
  ahşapOrta : new THREE.MeshStandardMaterial({ color: 0x6b4a2c, roughness: 0.7,  metalness: 0.05 }),
  ahşapAcik : new THREE.MeshStandardMaterial({ color: 0x8a6440, roughness: 0.68, metalness: 0.05 }),
  mermer    : new THREE.MeshStandardMaterial({ color: 0xd8cfc0, roughness: 0.5,  metalness: 0.02 }),
  pirinc    : new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.35, metalness: 0.8 }),
  zeminTas  : new THREE.MeshStandardMaterial({ color: 0x8c7a63, roughness: 0.9,  metalness: 0.0 }),
  halı      : new THREE.MeshStandardMaterial({ color: 0x4e2620, roughness: 0.98, metalness: 0.0 }),
  lamba     : new THREE.MeshStandardMaterial({ color: 0xf1e6cf, roughness: 0.6,  emissive: 0xffd9a0, emissiveIntensity: 0.9 }),
  sayfa     : new THREE.MeshStandardMaterial({ color: 0xefe4cd, roughness: 0.9 })
};

/* ---------- IŞIKLAR ---------- */
const ortam = new THREE.AmbientLight(0xffe6c4, 0.32);
sahne.add(ortam);

const gokyuzu = new THREE.HemisphereLight(0xffe3b8, 0x2a2016, 0.35);
sahne.add(gokyuzu);

// Ana yönlü ışık (uzun pencerelerden gelen gün ışığı hissi)
const anaIsik = new THREE.DirectionalLight(0xffd9a8, 0.7);
anaIsik.position.set(14, 22, 12);
anaIsik.castShadow = true;
anaIsik.shadow.mapSize.set(2048, 2048);
anaIsik.shadow.camera.left   = -28;
anaIsik.shadow.camera.right  =  28;
anaIsik.shadow.camera.top    =  28;
anaIsik.shadow.camera.bottom = -28;
anaIsik.shadow.camera.far    = 70;
anaIsik.shadow.bias = -0.0008;
sahne.add(anaIsik);

// Lambalar
const lambaIsiklari = [];
function lambaEkle(x, y, z) {
  const g = new THREE.PointLight(0xffc978, 1.5, 26, 2);
  g.position.set(x, y, z);
  g.castShadow = false;
  sahne.add(g);
  lambaIsiklari.push(g);

  // Lamba abajuru — içi boş, aşağı bakan şapka; üstte küçük bir disk kapatır
  const abajur = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14, 0.42, 0.34, 22, 1, true),
    MALZEME.lamba
  );
  abajur.position.set(x, y + 0.22, z);
  sahne.add(abajur);

  const kapak = new THREE.Mesh(new THREE.CircleGeometry(0.14, 20), MALZEME.lamba);
  kapak.rotation.x = -Math.PI / 2;
  kapak.position.set(x, y + 0.39, z);
  sahne.add(kapak);

  const ampul = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xfff2d6, emissive: 0xffe0a8, emissiveIntensity: 2.2 })
  );
  ampul.position.set(x, y + 0.12, z);
  sahne.add(ampul);

  // Askı teli
  const tel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.014, 0.014, 2.6, 6),
    new THREE.MeshStandardMaterial({ color: 0x2a1e14, roughness: 0.9 })
  );
  tel.position.set(x, y + 1.55, z);
  sahne.add(tel);

  return g;
}

/* ---------- ZEMİN ---------- */
const zemin = new THREE.Mesh(new THREE.PlaneGeometry(60, 64), MALZEME.zeminTas);
zemin.rotation.x = -Math.PI / 2;
zemin.receiveShadow = true;
sahne.add(zemin);

// Halı şerit (orta koridor)
const hali = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 40), MALZEME.halı);
hali.rotation.x = -Math.PI / 2;
hali.position.set(0, 0.012, -1);
hali.receiveShadow = true;
sahne.add(hali);

// Halı kenar şeritleri
[-2.65, 2.65].forEach(x => {
  const serit = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 40), new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.8 }));
  serit.rotation.x = -Math.PI / 2;
  serit.position.set(x, 0.015, -1);
  sahne.add(serit);
});

/* ---------- DUVARLAR VE TAVAN ---------- */
const duvarMalzeme = new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 0.92 });

function duvarGenislik(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), duvarMalzeme);
  m.position.set(x, y, z);
  m.receiveShadow = true;
  m.castShadow = true;
  sahne.add(m);
  return m;
}

const TAVAN_Y = 8.5;
const SALON_GEN = 34;   // X
const SALON_DER = 44;   // Z

// Arka duvar (-Z)
duvarGenislik(SALON_GEN, TAVAN_Y, 0.5, 0, TAVAN_Y / 2, -SALON_DER / 2);
// Ön duvar (+Z)
duvarGenislik(SALON_GEN, TAVAN_Y, 0.5, 0, TAVAN_Y / 2, SALON_DER / 2);
// Yan duvarlar
duvarGenislik(0.5, TAVAN_Y, SALON_DER, -SALON_GEN / 2, TAVAN_Y / 2, 0);
duvarGenislik(0.5, TAVAN_Y, SALON_DER,  SALON_GEN / 2, TAVAN_Y / 2, 0);

// Tavan
const tavan = new THREE.Mesh(new THREE.BoxGeometry(SALON_GEN, 0.4, SALON_DER),
  new THREE.MeshStandardMaterial({ color: 0x3a2b1e, roughness: 0.95 }));
tavan.position.set(0, TAVAN_Y, 0);
sahne.add(tavan);

// Tavan kirişleri
for (let z = -SALON_DER / 2 + 2; z < SALON_DER / 2; z += 4.5) {
  const kiris = new THREE.Mesh(new THREE.BoxGeometry(SALON_GEN - 1, 0.45, 0.5), MALZEME.ahşapKoyu);
  kiris.position.set(0, TAVAN_Y - 0.42, z);
  kiris.castShadow = true;
  sahne.add(kiris);
}

// Arka duvarda büyük kemerli pencere — cam, kayıt çubukları ve kemerli üst kısım
(function pencereKur() {
  const Z = -SALON_DER / 2 + 0.28;
  const GEN = 9, YUK = 5.2, ALT = 2.1;

  // Cam (aydınlık gökyüzü)
  const camMat = new THREE.MeshStandardMaterial({
    color: 0xdfeaf2, emissive: 0xbfd8e8, emissiveIntensity: 0.75, roughness: 0.35, metalness: 0.0
  });
  const cam = new THREE.Mesh(new THREE.PlaneGeometry(GEN, YUK), camMat);
  cam.position.set(0, ALT + YUK / 2, Z);
  sahne.add(cam);

  // Kemerli üst kısım (yarım daire)
  const kemer = new THREE.Mesh(new THREE.CircleGeometry(GEN / 2, 28, 0, Math.PI), camMat);
  kemer.position.set(0, ALT + YUK, Z - 0.002);
  sahne.add(kemer);

  // Çerçeve
  const cerceveMat = new THREE.MeshStandardMaterial({ color: 0x3a2b1e, roughness: 0.85 });

  // Kayıt çubukları (dikey)
  for (let i = -3; i <= 3; i++) {
    const cubuk = new THREE.Mesh(new THREE.BoxGeometry(0.13, YUK, 0.12), cerceveMat);
    cubuk.position.set((i * GEN) / 7, ALT + YUK / 2, Z + 0.06);
    sahne.add(cubuk);
  }
  // Yatay kayıtlar
  for (let j = 1; j <= 4; j++) {
    const cubuk = new THREE.Mesh(new THREE.BoxGeometry(GEN, 0.13, 0.12), cerceveMat);
    cubuk.position.set(0, ALT + (YUK * j) / 5, Z + 0.06);
    sahne.add(cubuk);
  }
  // Dış çerçeve
  const ustCerceve = new THREE.Mesh(new THREE.BoxGeometry(GEN + 0.5, 0.28, 0.2), cerceveMat);
  ustCerceve.position.set(0, ALT + YUK, Z + 0.08);
  sahne.add(ustCerceve);

  const altCerceve = new THREE.Mesh(new THREE.BoxGeometry(GEN + 0.5, 0.3, 0.2), cerceveMat);
  altCerceve.position.set(0, ALT - 0.15, Z + 0.08);
  sahne.add(altCerceve);

  [-1, 1].forEach(yon => {
    const yan = new THREE.Mesh(new THREE.BoxGeometry(0.28, YUK + 0.5, 0.2), cerceveMat);
    yan.position.set(yon * (GEN / 2 + 0.11), ALT + YUK / 2, Z + 0.08);
    sahne.add(yan);
  });

  // Kemer çerçevesi — yarım halka
  const halka = new THREE.Mesh(
    new THREE.TorusGeometry(GEN / 2 + 0.1, 0.1, 8, 32, Math.PI),
    cerceveMat
  );
  halka.position.set(0, ALT + YUK, Z + 0.08);
  sahne.add(halka);

  // Işık
  window.pencereIsik = new THREE.PointLight(0xffd089, 1.6, 40, 2);
  window.pencereIsik.position.set(0, 4.5, -SALON_DER / 2 + 3);
  sahne.add(window.pencereIsik);
})();

const pencereIsik = window.pencereIsik;

/* ---------- KİTAP RAFLARI ---------- */
const KITAP_ADLARI = [
  'Sessiz Ev', 'Kürk Mantolu Madonna', 'Tutunamayanlar', 'Aylak Adam', 'Huzur',
  'İnce Memed', 'Yaban', 'Bereketli Topraklar', 'Aşk-ı Memnu', 'Eylül',
  'Çalıkuşu', 'Sinekli Bakkal', 'Ateşten Gömlek', 'Vurun Kahpeye', 'Anayurt Oteli',
  'Puslu Kıtalar Atlası', 'Yer Demir Gök Bakır', 'Ortadirek', 'Demirciler Çarşısı', 'Ağrı Dağı Efsanesi',
  'Kuyucaklı Yusuf', 'Kiralık Konak', 'Mai ve Siyah', 'Araba Sevdası', 'Felatun Bey',
  'Beyaz Kale', 'Kara Kitap', 'Masumiyet Müzesi', 'Benim Adım Kırmızı', 'Kar',
  'Divan', 'Şehir Mektupları', 'Boğaziçi Mehtapları', 'Beş Şehir', 'İstanbul Hatırası',
  'Sefiller', 'Suç ve Ceza', 'Karamazov Kardeşler', 'Savaş ve Barış', 'Anna Karenina',
  'Dönüşüm', 'Dava', 'Yabancı', 'Veba', 'Yüz Yıllık Yalnızlık',
  'Simyacı', 'Körlük', 'Olasılıksız', 'Bir Bilim Adamının Romanı', 'Şu Çılgın Türkler'
];

const YAZARLAR = [
  'Y. Kemal', 'S. Ali', 'O. Atay', 'A. H. Tanpınar', 'R. N. Güntekin',
  'P. Safa', 'H. E. Adıvar', 'T. Buğra', 'A. Nesin', 'C. Külebi'
];

const KITAP_RENKLERI = [
  0x8c2f2f, 0x2f4f6b, 0x3f6b45, 0x7a5a2a, 0x5a2f5a,
  0x2f6b6b, 0x8a6a2f, 0x5e3a22, 0x334a63, 0x6b3344,
  0x44603a, 0x7d7a3f, 0x3a3f6b, 0x8a4b2a, 0x2f5a4a
];

// Kitap listesi — yaklaşınca gösterilecek başlıklar için kayıt
const yakinKitaplar = [];

function kitapSirti(genislik, yukseklik, derinlik, renk, baslik, yazar, dunyaPozisyon) {
  const grup = new THREE.Group();

  const govde = new THREE.Mesh(
    new THREE.BoxGeometry(genislik, yukseklik, derinlik),
    new THREE.MeshStandardMaterial({ color: renk, roughness: 0.8, metalness: 0.02 })
  );
  govde.castShadow = true;
  govde.receiveShadow = true;
  grup.add(govde);

  // Sırt üzerindeki altın şeritler
  const seritMat = new THREE.MeshStandardMaterial({ color: 0xc9a227, roughness: 0.4, metalness: 0.7 });
  [-0.28, 0.28].forEach(f => {
    const s = new THREE.Mesh(new THREE.BoxGeometry(genislik * 0.92, 0.018, derinlik * 0.92), seritMat);
    s.position.y = yukseklik * f;
    grup.add(s);
  });

  grup.position.copy(dunyaPozisyon);

  // Etiket verisi
  grup.userData = { baslik, yazar };
  yakinKitaplar.push(grup);

  return grup;
}

/**
 * Bir raf ünitesi üretir.
 * @param {number} x  merkez X
 * @param {number} z  merkez Z
 * @param {number} dondur  Y ekseni dönüşü (0 = +Z'ye bakar)
 */
function rafUnitesi(x, z, dondur) {
  const grup = new THREE.Group();
  grup.position.set(x, 0, z);
  grup.rotation.y = dondur;

  const GENISLIK = 6.2;
  const DERINLIK = 0.85;
  const YUKSEKLIK = 4.4;
  const RAf_SAYISI = 5;
  const bolumYuksekligi = (YUKSEKLIK - 0.6) / RAf_SAYISI;

  // Yan paneller
  [-1, 1].forEach(yon => {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.16, YUKSEKLIK, DERINLIK), MALZEME.ahşapKoyu);
    panel.position.set(yon * (GENISLIK / 2 - 0.08), YUKSEKLIK / 2, 0);
    panel.castShadow = true;
    panel.receiveShadow = true;
    grup.add(panel);
  });

  // Arka panel
  const arka = new THREE.Mesh(new THREE.BoxGeometry(GENISLIK, YUKSEKLIK, 0.08), MALZEME.ahşapKoyu);
  arka.position.set(0, YUKSEKLIK / 2, -DERINLIK / 2 + 0.04);
  arka.receiveShadow = true;
  grup.add(arka);

  // Tepe kornişi
  const tepe = new THREE.Mesh(new THREE.BoxGeometry(GENISLIK + 0.35, 0.22, DERINLIK + 0.2), MALZEME.ahşapOrta);
  tepe.position.set(0, YUKSEKLIK + 0.06, 0);
  tepe.castShadow = true;
  grup.add(tepe);

  // Raflar + kitaplar
  for (let r = 0; r < RAf_SAYISI; r++) {
    const y = 0.55 + r * bolumYuksekligi;

    const tahta = new THREE.Mesh(new THREE.BoxGeometry(GENISLIK - 0.2, 0.1, DERINLIK - 0.1), MALZEME.ahşapOrta);
    tahta.position.set(0, y, 0);
    tahta.castShadow = true;
    tahta.receiveShadow = true;
    grup.add(tahta);

    // Kitapları diz
    let imlec = -(GENISLIK / 2 - 0.45);
    const bitis = (GENISLIK / 2 - 0.45);

    while (imlec < bitis) {
      const kGen = 0.1 + Math.random() * 0.13;
      const kYuk = 0.52 + Math.random() * 0.3;
      const kDer = 0.42 + Math.random() * 0.12;

      if (imlec + kGen > bitis) break;

      const baslik = KITAP_ADLARI[Math.floor(Math.random() * KITAP_ADLARI.length)];
      const yazar  = YAZARLAR[Math.floor(Math.random() * YAZARLAR.length)];
      const renk   = KITAP_RENKLERI[Math.floor(Math.random() * KITAP_RENKLERI.length)];

      const dunya = new THREE.Vector3(
        imlec + kGen / 2,
        y + 0.05 + kYuk / 2,
        0.02
      );

      const kitap = kitapSirti(kGen, kYuk, kDer, renk, baslik, yazar, dunya);
      grup.add(kitap);

      imlec += kGen + 0.012;

      // Ara sıra yatay yığılmış kitap destesi
      if (Math.random() < 0.06 && imlec < bitis - 0.5) {
        for (let i = 0; i < 3; i++) {
          const yGen = 0.55 + Math.random() * 0.1;
          const yYuk = 0.09;
          const yDer = 0.36;
          const deste = new THREE.Mesh(
            new THREE.BoxGeometry(yGen, yYuk, yDer),
            new THREE.MeshStandardMaterial({
              color: KITAP_RENKLERI[Math.floor(Math.random() * KITAP_RENKLERI.length)],
              roughness: 0.85
            })
          );
          deste.position.set(imlec + 0.1, y + 0.1 + i * 0.095, 0);
          deste.castShadow = true;
          deste.receiveShadow = true;
          const dYazar = YAZARLAR[Math.floor(Math.random() * YAZARLAR.length)];
          const dBaslik = KITAP_ADLARI[Math.floor(Math.random() * KITAP_ADLARI.length)];
          deste.userData = { baslik: dBaslik, yazar: dYazar };
          yakinKitaplar.push(deste);
          grup.add(deste);
        }
        imlec += 0.6;
      }
    }
  }

  sahne.add(grup);
  return grup;
}

// Sürükle-bak (dokunmatik + fare)
let surukleniyor = false;
let sonX = 0, sonY = 0;

function bakBaslat(x, y) {
  surukleniyor = true;
  sonX = x; sonY = y;
}
function bakHareket(x, y) {
  if (!surukleniyor) return;
  const dx = x - sonX;
  const dy = y - sonY;
  oyuncu.yaw   -= dx * oyuncu.bakHiz * 1.4;
  oyuncu.pitch -= dy * oyuncu.bakHiz * 1.4;
  oyuncu.pitch = Math.max(-1.15, Math.min(1.15, oyuncu.pitch));
  sonX = x; sonY = y;
}
function bakBitir() { surukleniyor = false; }

window.addEventListener('mouseup', bakBitir);

  if (e.touches.length === 1) bakBaslat(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });

  if (e.touches.length === 1) bakHareket(e.touches[0].clientX, e.touches[0].clientY);

/* ---------- ÇARPIŞMA SINIRLARI ---------- */
function sinirla(p) {
  const IC_X = SALON_GEN / 2 - 1.0;
  const IC_Z = SALON_DER / 2 - 1.0;
  p.x = Math.max(-IC_X, Math.min(IC_X, p.x));
  p.z = Math.max(-IC_Z, Math.min(IC_Z, p.z));

  // Ada rafların içinden geçmeyi engelle
  const engeller = [
    { x1: -8.1, x2: -6.9, z1: -16, z2: 12 },
    { x1:  6.9, x2:  8.1, z1: -16, z2: 12 }
  ];
  engeller.forEach(e => {
    if (p.x > e.x1 && p.x < e.x2 && p.z > e.z1 && p.z < e.z2) {
      // En yakın kenara it
      const solBosluk = Math.abs(p.x - e.x1);
      const sagBosluk = Math.abs(p.x - e.x2);
      p.x = solBosluk < sagBosluk ? e.x1 - 0.05 : e.x2 + 0.05;
    }
  });

  return p;
}

/* ---------- DÖNGÜ ---------- */
const saat = new THREE.Clock();

function kirp(v) {
  return Math.max(0, Math.min(1, v));
}

function animasyon() {
  requestAnimationFrame(animasyon);

  const dt = Math.min(saat.getDelta(), 0.06);
  const t = saat.getElapsedTime();

  // Hareket
  const ileri = (KLAVYE['w'] || KLAVYE['arrowup'] || SANAL.w ? 1 : 0) -
                (KLAVYE['s'] || KLAVYE['arrowdown'] || SANAL.s ? 1 : 0);
  const yan   = (KLAVYE['d'] || KLAVYE['arrowright'] || SANAL.d ? 1 : 0) -
                (KLAVYE['a'] || KLAVYE['arrowleft'] || SANAL.a ? 1 : 0);

  if (ileri !== 0 || yan !== 0) {
    const yonVek = new THREE.Vector3(
      Math.sin(oyuncu.yaw),
      0,
      Math.cos(oyuncu.yaw)
    );
    const sagVek = new THREE.Vector3(yonVek.z, 0, -yonVek.x);

    const hareket = new THREE.Vector3()
      .addScaledVector(yonVek, ileri)
      .addScaledVector(sagVek, yan)
      .normalize()
      .multiplyScalar(oyuncu.hiz * dt);

    oyuncu.konum.add(hareket);
    sinirla(oyuncu.konum);
  }

  // Hafif yürüme sallanması
  const yuruyor = (ileri !== 0 || yan !== 0);
  const sallanma = yuruyor ? Math.sin(t * 9) * 0.022 : 0;

  kamera.position.set(oyuncu.konum.x, oyuncu.konum.y + sallanma, oyuncu.konum.z);

  const yon = new THREE.Vector3(
    Math.sin(oyuncu.yaw) * Math.cos(oyuncu.pitch),
    Math.sin(oyuncu.pitch),
    Math.cos(oyuncu.yaw) * Math.cos(oyuncu.pitch)
  );
  kamera.lookAt(
    kamera.position.x + yon.x,
    kamera.position.y + yon.y,
    kamera.position.z + yon.z
  );

  // Okuyucu animasyonu — nefes ve hafif salınım
  for (let i = 0; i < okuyucular.length; i++) {
    const o = okuyucular[i];
    const u = o.userData.okuyucu;
    o.position.y = u.baslangicY + Math.sin(t * 1.1 + u.faz) * 0.012;

    if (!u.oturuyor) {
      o.rotation.z = Math.sin(t * 0.7 + u.faz) * 0.012;
    }
  }

  // Lamba titremesi (canlı ışık)
  for (let i = 0; i < lambaIsiklari.length; i++) {
    const l = lambaIsiklari[i];
    const carpanlar = [1, 0.55, 1.45];
    const temel = 1.5 * carpanlar[isikModu];
    l.intensity = temel + Math.sin(t * 2.3 + i) * 0.06;
  }

  // Yakın kitap ipucu
  ipucuZaman += dt;
  if (ipucuZaman > 0.15) {
    ipucuZaman = 0;
    const kitap = yakindakiKitap();
    if (kitap) {
      ipucuBaslik.textContent = kitap.userData.baslik || 'Adsız Cilt';
      ipucuAlt.textContent = (kitap.userData.yazar || 'Bilinmeyen') + ' · rafın önündesiniz';
      ipucuEl.classList.add('gorunur');
    } else {
      ipucuEl.classList.remove('gorunur');
    }
  }

  renderer.render(sahne, kamera);
}

/* ---------- PENCERE BOYUTU ---------- */
function boyutlandir() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  kamera.aspect = w / h;
  kamera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', boyutlandir);
boyutlandir();

/* ---------- BAŞLAT ---------- */
animasyon();

setTimeout(() => {
  document.getElementById('perde').classList.add('gizle');
}, 700);
</script>
