<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İlan Ver — Numex İlan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="wrap">
    <h1 class="sayfa-baslik">Yeni İlan Ver 🚀</h1>

    <form class="form" id="ilan-formu">
      <div class="form-satir">
        <label>Başlık *
          <input id="t-baslik" required placeholder="örn. 3+1 Satılık Daire — Başakşehir" maxlength="90" />
        </label>
        <label>Kategori *
          <select id="t-kategori" required></select>
        </label>
      </div>

      <div class="form-satir">
        <label>Fiyat (₺) *
          <input id="t-fiyat" type="number" required min="1" placeholder="örn. 1500000" />
        </label>
        <label>Görsel (URL)
          <input id="t-gorsel" type="url" placeholder="https://... (opsiyonel)" />
        </label>
      </div>

      <div class="form-satir">
        <label>İl *
          <input id="t-il" required name="il" list="iller" placeholder="örn. İstanbul" />
          <datalist id="iller">
            <option>Adana</option><option>Ankara</option><option>Antalya</option><option>Bursa</option>
            <option>İstanbul</option><option>İzmir</option><option>Muğla</option>
          </datalist>
        </label>
        <label>İlçe
          <input id="t-ilce" placeholder="örn. Kadıköy" />
        </label>
      </div>

      <div class="form-satir">
        <label>Ad Soyad *
          <input id="t-sahip" required placeholder="Adın ve soyadının baş harfi (örn. Ayşe K.)" />
        </label>
        <label>Telefon *
          <input id="t-telefon" required placeholder="05xx xxx xx xx" />
        </label>
      </div>

      <label>Görsel Önizleme
        <img id="onizleme" class="oznizleme" alt="Görsel önizleme" />
      </label>

      <label>Açıklama
        <textarea id="t-aciklama" placeholder="İlanınla ilgili detayları yaz: durum, özellikler, ulaşım..." ></textarea>
      </label>

      <div id="fb-kutu"></div>

      <div style="display:flex;gap:12px">
        <button type="submit" class="btn btn-dolu">📢 İlanı Yayınla</button>
        <a class="btn btn-cerceve" href="index.html">Vazgeç</a>
      </div>
    </form>
  </main>

  <footer class="footer">Numex İlan Platformu — ilan verme sayfası</footer>

  <script src="js/api.js"></script>
  <script src="js/ilan-ac.js"></script>
</body>
</html>
