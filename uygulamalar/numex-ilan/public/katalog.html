<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katalog — Numex İlan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="wrap">
    <div class="filtreler">
      <select id="f-kategori"><option value="">Tüm Kategoriler</option></select>
      <select id="f-il"><option value="">Tüm İller</option></select>
      <input id="f-min" type="number" placeholder="Min ₺" />
      <input id="f-max" type="number" placeholder="Max ₺" />
      <input id="f-ara" type="text" placeholder="Anahtar kelime..." />
      <select id="f-sirala">
        <option value="yeni">En Yeni</option>
        <option value="fiyat-artan">Fiyat (artan)</option>
        <option value="fiyat-azalan">Fiyat (azalan)</option>
      </select>
      <button id="f-uygula" class="btn btn-dolu">Filtrele</button>
    </div>
    <div id="sonuc-bilgi" class="meta" style="margin-bottom:14px"></div>
    <div id="ilanlar" class="ilan-grid"></div>
    <div id="bos" class="bos" style="display:none">
      <div class="ikon">🔍</div>
      Aradığın kriterlere uygun ilan bulunamadı.
    </div>
  </main>

  <footer class="footer">Numex İlan Platformu — katalog sayfası</footer>

  <script src="js/api.js"></script>
  <script src="js/katalog.js"></script>
</body>
</html>
