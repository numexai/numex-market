<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gökbey-9 · Fırlatma Rampası 3B</title>
<!-- NUMEX-DÜZELTME (2026-10-22): Tarayıcı /favicon.ico istiyordu ve sunucu 404 dönüyordu. İstek hiç doğmasın diye satır içi SVG favicon eklendi — harici dosya gerekmez, 404 ortadan kalkar. -->

<style>
  :root{
    --cam: rgba(10, 16, 26, .55);
    --cam-brd: rgba(150, 190, 230, .18);
    --txt: #e8eef6;
    --dim: #93a4b8;
    --acc: #64c8ff;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; }
  html, body{ height: 100%; overflow: hidden; background: #0a1018; }
  body{
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--txt);
    -webkit-font-smoothing: antialiased;
  }
  #sahne{ position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #sahne:active{ cursor: grabbing; }

  .katman{ position: fixed; z-index: 10; pointer-events: none; }
  .panel{
    background: var(--cam);
    border: 1px solid var(--cam-brd);
    border-radius: 10px;
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    pointer-events: auto;
  }

  /* ---------- Sol üst başlık ---------- */
  #baslik{ top: 18px; left: 18px; padding: 14px 18px; }
  #baslik h1{
    font-size: clamp(16px, 1.6vw, 22px);
    font-weight: 600;
    letter-spacing: .5px;
    display: flex; align-items: center; gap: 9px;
  }
  #baslik h1 span.nokta{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--acc);
    box-shadow: 0 0 10px var(--acc);
    animation: nefes 2.4s ease-in-out infinite;
  }
  @keyframes nefes{ 0%,100%{ opacity:.45; transform: scale(.85);} 50%{ opacity:1; transform: scale(1);} }
  #baslik .alt{
    margin-top: 5px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1.6px;
    text-transform: uppercase;
  }

  /* ---------- Sekmeler (Genel bakış / Yapı / Fırlatma) ---------- */
  #sekmeler{
    top: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; padding: 5px; z-index: 12;
  }
  .sekme{
    font-family: inherit; font-size: 12px; letter-spacing: .6px;
    color: var(--dim); background: none; border: none; border-radius: 6px;
    padding: 8px 18px; cursor: pointer; transition: .2s; white-space: nowrap;
  }
  .sekme:hover{ color: var(--txt); background: rgba(255,255,255,.06); }
  .sekme.aktif{ color: #04121c; background: var(--acc); font-weight: 700; }

  /* Ölçü katmanı */
  #olcuKatman{ position: fixed; inset: 0; pointer-events: none; z-index: 6; }
  .olcuCizgi{ position: absolute; background: rgba(100,200,255,.55); }
  .olcuCizgi.dikey{ width: 1px; }
  .olcuCizgi.yatay{ height: 1px; }
  .olcuUc{ position: absolute; width: 7px; height: 7px; border: 1px solid rgba(100,200,255,.8);
    background: rgba(10,16,26,.8); border-radius: 50%; transform: translate(-50%,-50%); }
  .olcuEtiket{
    position: absolute; transform: translate(-50%,-50%);
    font-size: 11px; font-variant-numeric: tabular-nums; letter-spacing: .5px;
    color: #cfe6fb; background: rgba(10,16,26,.82); border: 1px solid rgba(100,200,255,.35);
    border-radius: 4px; padding: 3px 8px; white-space: nowrap;
  }
  .olcuNot{
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 1.2px; color: rgba(147,164,184,.75);
    text-transform: uppercase;
  }

  /* Fırlatma paneli */
  #firlatmaPanel{ bottom: 96px; left: 50%; transform: translateX(-50%);
    padding: 12px 20px; display: none; text-align: center; min-width: 260px; }
  #firlatmaPanel.acik{ display: block; }
  #geriSayim{
    font-size: 40px; font-weight: 200; letter-spacing: 3px;
    font-variant-numeric: tabular-nums; line-height: 1.1;
    color: var(--acc); text-shadow: 0 0 22px rgba(100,200,255,.5);
  }
  #asamaAd{ font-size: 11px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-top: 4px; }

  /* ---------- Sağ üst performans (yalnız geliştirici kipi) ---------- */
  #perf{ top: 18px; right: 18px; padding: 11px 14px; min-width: 176px;
    display: none; }
  #perf.acik{ display: block; }
  #perf .satir{
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; color: var(--dim); letter-spacing: .6px;
    padding: 3px 0;
  }
  #perf .satir b{
    color: var(--txt); font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  #perf .dil{
    margin-top: 8px; display: flex; gap: 6px;
    border-top: 1px solid var(--cam-brd); padding-top: 9px;
  }
  .dugme{
    font-family: inherit; font-size: 11px;
    color: var(--dim); background: rgba(255,255,255,.05);
    border: 1px solid var(--cam-brd); border-radius: 6px;
    padding: 6px 10px; cursor: pointer;
    transition: .18s; letter-spacing: .5px;
  }
  .dugme:hover{ color: var(--txt); background: rgba(100,200,255,.14); border-color: rgba(100,200,255,.4); }
  .dugme.aktif{ color: #04121c; background: var(--acc); border-color: var(--acc); font-weight: 700; }

  /* ---------- Alt orta zaman çubuğu ---------- */
  #zaman{
    bottom: 22px; left: 50%; transform: translateX(-50%);
    padding: 12px 18px; width: min(520px, calc(100vw - 36px));
  }
  #zamanBasliklar{
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--dim); letter-spacing: .8px;
    margin-bottom: 9px;
  }
  #zamanBasliklar span{ transition: color .2s; }
  #zamanBasliklar span.secili{ color: var(--acc); font-weight: 700; }
  #kaydirici{
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg,#f0a06a 0%, #8fc7ee 33%, #e8894f 66%, #1b2540 100%);
    outline: none; cursor: pointer;
  }
  #kaydirici::-webkit-slider-thumb{
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; border: 2px solid var(--acc);
    box-shadow: 0 0 12px rgba(100,200,255,.7);
    cursor: pointer;
  }
  #kaydirici::-moz-range-thumb{
    width: 16px; height: 16px; border: 2px solid var(--acc);
    border-radius: 50%; background: #fff;
    box-shadow: 0 0 12px rgba(100,200,255,.7); cursor: pointer;
  }

  /* ---------- İpucu ---------- */
  #ipucu{
    bottom: 24px; left: 18px;
    font-size: 11px; color: rgba(200,215,235,.5);
    letter-spacing: .3px; max-width: 210px; line-height: 1.6;
  }

  /* ---------- Parça bilgi kartı ---------- */
  #kart{
    top: 50%; right: 18px; transform: translateY(-50%) translateX(calc(100% + 30px));
    width: min(310px, calc(100vw - 36px));
    padding: 18px 20px;
    transition: transform .35s cubic-bezier(.22,.9,.3,1);
  }
  #kart.acik{ transform: translateY(-50%) translateX(0); }
  #kart h2{ font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  #kart .etiket{
    font-size: 10px; color: var(--acc); letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 10px; display: block;
  }
  #kart p{ font-size: 12.5px; line-height: 1.75; color: #c3d0e0; }
  #kart .kapat{
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; color: var(--dim);
    font-size: 18px; cursor: pointer; line-height: 1; padding: 4px;
  }
  #kart .kapat:hover{ color: var(--txt); }
  #kart .olcu{
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--cam-brd);
    font-size: 11px; color: var(--dim); display: flex; justify-content: space-between;
  }

  /* ---------- Yükleniyor ---------- */
  #yukleniyor{
    position: fixed; inset: 0; z-index: 100;
    background: #0a1018;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; transition: opacity .6s;
  }
  #yukleniyor.bitti{ opacity: 0; pointer-events: none; }
  #yukleniyor .cizgi{
    width: 160px; height: 2px; background: rgba(255,255,255,.1); overflow: hidden; border-radius: 2px;
  }
  #yukleniyor .cizgi::after{
    content: ""; display: block; width: 40%; height: 100%;
    background: var(--acc); animation: akip 1.1s ease-in-out infinite;
  }
  @keyframes akip{ 0%{ transform: translateX(-100%);} 100%{ transform: translateX(350%);} }
  #yukleniyor span{ font-size: 12px; color: var(--dim); letter-spacing: 2px; }

  @media (max-width: 760px){
    #ipucu{ display: none; }
    #kart{ top: auto; bottom: 108px; right: 12px; transform: translateX(calc(100% + 30px)); }
    #kart.acik{ transform: translateX(0); }
    #perf{ padding: 8px 10px; min-width: 140px; }
    #baslik{ padding: 10px 12px; }
  }
</style>
</head>
<body>

<canvas id="sahne"></canvas>

<div id="yukleniyor">
  <span>SAHNE HAZIRLANIYOR</span>
  <div class="cizgi"></div>
</div>

<div id="baslik" class="katman panel">
  <h1><span class="nokta"></span>Gökbey-9</h1>
  <div class="alt">Fırlatma Rampası · Canlı Sahne</div>
</div>

<div id="sekmeler" class="katman panel">
  <button class="sekme aktif" data-bolum="genel">Genel Bakış</button>
  <button class="sekme" data-bolum="yapi">Yapı</button>
  <button class="sekme" data-bolum="firlatma">Fırlatma</button>
</div>

<div id="perf" class="katman panel">
  <div class="satir"><span>FPS</span><b id="pFps">--</b></div>
  <div class="satir"><span>Üçgen</span><b id="pUcgen">--</b></div>
  <div class="satir"><span>Çizim çağrısı</span><b id="pCizim">--</b></div>
  <div class="dil">
    <button class="dugme" id="btnSifirla">Kamerayı Sıfırla</button>
    <button class="dugme" id="btnParalel">Kamera: Paralel</button>
  </div>
</div>

<!-- Ölçü çizgileri katmanı (Yapı bölümünde görünür) -->
<div id="olcuKatman"></div>

<!-- Fırlatma bölümü paneli -->
<div id="firlatmaPanel" class="katman panel">
  <div id="geriSayim">T-10</div>
  <div id="asamaAd">Hazırlık</div>
</div>

<div id="zaman" class="katman panel">
  <div id="zamanBasliklar">
    <span data-t="0">Şafak</span>
    <span data-t="1">Öğle</span>

</div>

  Parçaya tıkla: bilgi
</div>

<div id="kart" class="katman panel">
  <button class="kapat" id="kartKapat">×</button>
  <span class="etiket">Parça</span>

  <p id="kartMetin">—</p>
  <div class="olcu"><span id="kartYukseklik"></span><span id="kartAgirlik"></span></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js"
  }

<script type="module">
import * as THREE from 'three';

/* =========================================================
   GÖKBEY-9 · FIRLATMA RAMPASI
   Tek dosya, sıfır harici model. Tüm geometri kodla üretilir.
   ========================================================= */

const tuval = document.getElementById('sahne');
const pFps = document.getElementById('pFps');
const pUcgen = document.getElementById('pUcgen');
const pCizim = document.getElementById('pCizim');
const btnSifirla = document.getElementById('btnSifirla');
const btnParalel = document.getElementById('btnParalel');
const sahne = new THREE.Scene();

const kamera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.5, 4000);
const KAMERA_BASLANGIC = new THREE.Vector3(72, 44, 78);
kamera.position.copy(KAMERA_BASLANGIC);

const cizici = new THREE.WebGLRenderer({ canvas: tuval, antialias: true, powerPreference: 'high-performance' });
// NUMEX-DÜZELTME (2026-10-22): Tuval ekranın tamamını kaplamıyordu: setSize innerWidth/innerHeight ile bir kez ayarlanıyor, ama #sahne CSS'te inset:0 ile konumlandığı için gerçek ölçü CSS kutusundan gelmeli. Boyutu elemanın kendi ölçüsünden alıyorum.
// NUMEX-DÜZELTME (2026-10-22): Kök neden: getBoundingClientRect() ile ölçüp setSize(...,false) çağırmak kısır döngü yarattı — canvas henüz boyutlanmadığı için CSS kutusu 300×150 dönüyor, setSize CSS'i güncellemediği için de öyle kalıyordu; sahne 300×150'ye çöküyordu. Pencere ölçüsüne dönüldü, CSS de güncelleniyor.
// Tuval boyutu: pencere ölçüsü (CSS de güncellenir — updateStyle varsayılan true)
function tuvalBoyutla(){
  cizici.setSize(Math.max(1, window.innerWidth), Math.max(1, window.innerHeight));
}
tuvalBoyutla();
cizici.setPixelRatio(1); // 2 yerine 1: retina olmayan ekranlarda piksel maliyeti 4 kat azalır
cizici.shadowMap.enabled = true;
cizici.shadowMap.type = THREE.PCFSoftShadowMap; // blok gölge yerine yumuşak kenar
cizici.toneMapping = THREE.ACESFilmicToneMapping;
cizici.toneMappingExposure = 1.0;

/* ---------------- Yörünge kontrolü (bağımlılıksız) ---------------- */
// NUMEX-DÜZELTME (2026-10-22): Referans görselde kamera alçak ve ufka yakın bakıyor (ufuk ekranın ortasında, kompleks silüet halinde). Önceki açı kuşbakışıydı; açıyı düşürüp hedefi yukarı aldım.
// NUMEX-DÜZELTME (2026-10-22): Açılışta kompleks ekranın ~%25'ini kaplıyordu (istek: roket ekranın yarısından fazlası). Mesafeyi 205'ten 118'e çekip hedefi roketin orta yüksekliğine (y=33) aldım; roket dikey karede ~%62 doluluk veriyor.
// NUMEX-DÜZELTME (2026-10-22): Roket ekranın ~%30'unda kalıyordu; kule, küreler ve paratonerler kadrajı dolduruyordu. Referans açıyı koruyup mesafeyi 118→72'ye çekip hedefi roketin gövde ortasına (y=36) aldım; roket dikey karede ~%62 doluluk veriyor.
// NUMEX-DÜZELTME (2026-10-22): 72 birimde roketin burnu ve nozulları kadraj dışına taşıyordu; paratoner direkleri ön planda ekranı ikiye bölüyordu. Mesafeyi 96'ya, dik bakış açısını 0.10'a aldım; roketin tamamı (y=3.6..60.4) görünür ve dikeyde ~%58 doluluk verir. Yatayda da kule ve çevre sığar.
// NUMEX-DÜZELTME (2026-10-22): Roket ekranın ~%35'inde kalıyordu ve ön plandaki paratoner direkleri kadrajı ikiye bölüyordu. Açıyı yandan (0.72) daha öne (1.05) alıp mesafeyi 96→78'e indirdim; direkler artık roketin önünden geçmiyor, roket dikeyde ~%62 doluluk veriyor.
// NUMEX-DÜZELTME (2026-10-22): Paratoner direkleri 45/135/225/315 derecede, 40 birim yarıçapta duruyor; kamera her açıda bir direğin arkasına düşüp roketi kesiyordu. Kamera açısını 0.72 rad (~41°) yerine 1.571 rad (90°, direk boşluğu) aldım — roketin önünden direk geçmez.
// Paratonerler 45/135/225/315°'de durur; kamera 90°'de (direk boşluğu) konumlanır.
// NUMEX-DÜZELTME (2026-10-22): 84 birimde kamera çok yaklaşmış: ön plandaki yakıt küresi kadrajın dörtte birini kaplıyor ve kule rokete yapışık görünüyordu. Mesafeyi 105'e, hedef yüksekliğini 33'e aldım; roket dikeyde ~%55 doluluk verir, küre ve kule ayrışır.
const KAMERA_SIFIR = { aciX: 0.13, aciY: 1.50, mesafe: 105, hedef: new THREE.Vector3(0, 33, 0) };

const kontroller = {
  hedef: KAMERA_SIFIR.hedef.clone(),
  aciX: KAMERA_SIFIR.aciX,      // dikey (küçük = ufka yakın, engin görünüm)
  aciY: KAMERA_SIFIR.aciY,      // yatay
  mesafe: KAMERA_SIFIR.mesafe,
  hedefMesafe: KAMERA_SIFIR.mesafe,
  surukle: false,
  sonX: 0, sonY: 0,

  // Her karede çağrılan tek güncelleme noktası
  update: function(){
    this.mesafe += (this.hedefMesafe - this.mesafe) * 0.12; // yumuşak yakınlaştırma
    kamerayiKonumla();
  }
};

function kamerayiKonumla(){
  const d = kontroller.mesafe;
  const x = kontroller.hedef.x + d * Math.cos(kontroller.aciX) * Math.sin(kontroller.aciY);
  const y = kontroller.hedef.y + d * Math.sin(kontroller.aciX);
  const z = kontroller.hedef.z + d * Math.cos(kontroller.aciX) * Math.cos(kontroller.aciY);
  kamera.position.set(x, y, z);
  kamera.lookAt(kontroller.hedef);
  // NUMEX-DÜZELTME (2026-10-22): Kök neden: orto kamera aktifken konumu 'kamera' (perspektif) nesnesinden kopyalanıyordu; perspektif kamera orto modda güncellenmediği için değerleri bayat/yanlış kalıyor ve paralel görünüm ters dönüyordu. Artık iki kamera da aynı yörünge hesabından besleniyor.
  // Paralel kamera seçiliyse onu da AYNI yörünge hesabından konumla
  if (aktifKamera !== kamera){
    aktifKamera.position.set(x, y, z);
    aktifKamera.lookAt(kontroller.hedef);
    aktifKamera.updateMatrixWorld();
  }
}

let aktifKamera = kamera; // varsayılan: perspektif

kamerayiKonumla();

tuval.addEventListener('pointerdown', e => {
  kontroller.surukle = true;
  kontroller.sonX = e.clientX; kontroller.sonY = e.clientY;
  tuval.setPointerCapture(e.pointerId);
});
tuval.addEventListener('pointerup', e => {
  kontroller.surukle = false;
  try { tuval.releasePointerCapture(e.pointerId); } catch (_) {}
});
tuval.addEventListener('pointermove', e => {
  if (!kontroller.surukle) return;
  const dx = e.clientX - kontroller.sonX;
  const dy = e.clientY - kontroller.sonY;
  kontroller.sonX = e.clientX; kontroller.sonY = e.clientY;
  kontroller.aciY -= dx * 0.005;
  kontroller.aciX = Math.max(0.12, Math.min(1.45, kontroller.aciX + dy * 0.004));
});
tuval.addEventListener('wheel', e => {
  e.preventDefault();
  kontroller.hedefMesafe = Math.max(34, Math.min(240, kontroller.hedefMesafe + e.deltaY * 0.09));
}, { passive: false });

// Dokunmatik iki parmak yakınlaştırma
let parmakMesafe = null;
tuval.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const a = e.touches[0], b = e.touches[1];
  const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (parmakMesafe !== null) {
    kontroller.hedefMesafe = Math.max(34, Math.min(240, kontroller.hedefMesafe - (d - parmakMesafe) * 0.35));
  }
  parmakMesafe = d;
}, { passive: false });
tuval.addEventListener('touchend', () => { parmakMesafe = null; });

/* Kamera sıfırlama yukarıda (KAMERA_SIFIR ile) tek yerden yönetiliyor. */

/* ---------------- Gökyüzü (zaman dilimine göre) ---------------- */
const gokyuzuUniform = {
  ustRenk:   { value: new THREE.Color(0x1d3a5f) },
  ortaRenk:  { value: new THREE.Color(0xd88a55) },
  altRenk:   { value: new THREE.Color(0x14202e) },
  gunesYon:  { value: new THREE.Vector3(0.6, 0.12, -1).normalize() },
  gunesGuc:  { value: 1.0 },
  geceFaktoru: { value: 0.0 }
};

const gokyuzuMalzeme = new THREE.ShaderMaterial({
  uniforms: gokyuzuUniform,
  side: THREE.BackSide,
  depthWrite: false,
  vertexShader: `
    varying vec3 vYon;
    void main(){
      vYon = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 ustRenk; uniform vec3 ortaRenk; uniform vec3 altRenk;
    uniform vec3 gunesYon; uniform float gunesGuc; uniform float geceFaktoru;
    varying vec3 vYon;

    // Sade, tekrarlanabilir yıldız gürültüsü
    float yildizKatmani(vec3 yon, float olcek){
      vec3 p = yon * olcek;
      vec3 hucre = floor(p);
      float rast = fract(sin(dot(hucre, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
      float esik = step(0.9965, rast);              // çok seyrek noktalar

// Platform yüzeyine serilen doku plakası (canvas ile üretilir, harici dosya yok)
function betonDokusu(){
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 1024;
  const ctx = cv.getContext('2d');

  // Taban beton
  ctx.fillStyle = '#7d7a73';
  ctx.fillRect(0, 0, 1024, 1024);

  // İnce gren
  const img = ctx.getImageData(0, 0, 1024, 1024);
  for (let i = 0; i < img.data.length; i += 4){
    const n = (Math.random() - 0.5) * 26;
    img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
  }
  ctx.putImageData(img, 0, 0);

  // Panel derzleri (8×8 beton plaka)
  ctx.strokeStyle = 'rgba(45,44,42,.55)';
  ctx.lineWidth = 5;
  for (let i = 0; i <= 8; i++){
    const p = (i / 8) * 1024;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, 1024); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(1024, p); ctx.stroke();
  }

  // Egzoz isi (ortada koyu radyal leke)
  const g = ctx.createRadialGradient(512, 512, 40, 512, 512, 430);
  g.addColorStop(0, 'rgba(18,14,10,.85)');
  g.addColorStop(0.55, 'rgba(40,34,28,.4)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 1024);

  // Çatlaklar
  ctx.strokeStyle = 'rgba(35,33,30,.5)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 26; i++){
    ctx.beginPath();
    let x = Math.random() * 1024, y = Math.random() * 1024;
    ctx.moveTo(x, y);
    for (let j = 0; j < 7; j++){
      x += (Math.random() - 0.5) * 90;
      y += (Math.random() - 0.5) * 90;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // Sarı güvenlik şeritleri (rampa çevresi)
  ctx.strokeStyle = 'rgba(214,178,72,.62)';
  ctx.lineWidth = 12;
  ctx.strokeRect(250, 250, 524, 524);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

function yakitKuresi(x, z, r, renk){
  const g = new THREE.Group();

    ayak.rotation.x = -Math.sin(aci) * 0.22;
    g.add(ayak);
  }
  return g;
}

const kaydirici = document.getElementById('kaydirici');
const zamanBasliklar = [...document.querySelectorAll('#zamanBasliklar span')];
let aktifZaman = 0;

function zamanUygula(t){ // t: 0..3 arası ondalık
  const i0 = Math.floor(t) % 4;
  const i1 = (i0 + 1) % 4;
  const f = t - Math.floor(t);
  const A = ZAMANLAR[i0], B = ZAMANLAR[i1];

  const karis = (a, b) => new THREE.Color(a).lerp(new THREE.Color(b), f);
  const say = (a, b) => a + (b - a) * f;

  gokyuzuUniform.ustRenk.value.copy(karis(A.ust, B.ust));
  gokyuzuUniform.ortaRenk.value.copy(karis(A.orta, B.orta));
  gokyuzuUniform.altRenk.value.copy(karis(A.alt, B.alt));
  gokyuzuUniform.gunesGuc.value = say(A.gokyuzuGuc, B.gokyuzuGuc);
  gokyuzuUniform.geceFaktoru.value = say(A.gece, B.gece);

  // Sahne lambaları: gece parlak, gündüz sönük
  const geceF = say(A.gece, B.gece);
  for (const lamba of lambaIzgarasi){
    lamba.material.color.setRGB(
      0.35 + geceF * 0.65,
      0.32 + geceF * 0.55,
      0.20 + geceF * 0.25
    );
  }

  sahne.fog.color.copy(karis(A.sis, B.sis));
  sahne.fog.density = say(A.sisYog, B.sisYog);

  gunes.color.copy(karis(A.gunesRenk, B.gunesRenk));
  gunes.intensity = say(A.gunesGuc, B.gunesGuc);
  gunes.position.set(
    say(A.gunesPoz[0], B.gunesPoz[0]),
    say(A.gunesPoz[1], B.gunesPoz[1]),
    say(A.gunesPoz[2], B.gunesPoz[2])
  );

  gokyuzuIsik.intensity = say(A.gokyuzuInt, B.gokyuzuInt);
  dolguIsik.intensity = 0.35 + (1 - say(A.gece, B.gece)) * 0.35;
  cizici.toneMappingExposure = say(A.pozlama, B.pozlama);
  havaUniform.parlaklik.value = 1 - say(A.gece, B.gece) * 0.75;
}

// Zaman dilimini uygulayan TEK giriş noktası (etiket + kaydırıcı buradan geçer)
function zamaniAyarla(t){
  const v = Math.max(0, Math.min(3.999, t));
  aktifZaman = v;
  zamanUygula(v);
  const yakin = Math.round(v) % 4;
  zamanBasliklar.forEach((s, i) => s.classList.toggle('secili', i === yakin));
  kaydirici.value = String(Math.round(v / 3.999 * 1000));
}

zamanBasliklar.forEach((s, i) => {
  s.addEventListener('click', () => zamaniAyarla(i));
});

kaydirici.addEventListener('input', () => {
  zamaniAyarla(parseFloat(kaydirici.value) / 1000 * 3.999);
});

// NUMEX-DÜZELTME (2026-10-22): Kök neden: kart, kartBaslik, kartMetin, kartYukseklik, kartAgirlik, kartKapat değişkenleri hiç tanımlanmamıştı; kod bunları global id'lerden otomatik alıyordu ve kartiGoster çağrısı sessizce patlayıp kart hiç açılmıyordu. Hepsi açıkça sorgulanıyor.
// Kart DOM referansları (açıkça tanımlı — global id tahminine bırakma)
const kart = document.getElementById('kart');
const kartBaslik = document.getElementById('kartBaslik');
const kartMetin = document.getElementById('kartMetin');
const kartYukseklik = document.getElementById('kartYukseklik');
const kartAgirlik = document.getElementById('kartAgirlik');
const kartKapat = document.getElementById('kartKapat');

function kartiGoster(veri){
  kartBaslik.textContent = veri.ad;
  kartMetin.textContent = veri.metin;
  kartYukseklik.textContent = veri.yukseklik || '—';
  kartAgirlik.textContent = veri.agirlik || '—';
  kart.classList.add('acik');
}
function kartiKapat(){
  kart.classList.remove('acik');
  if (seciliParca){
    seciliParca.traverse(o => {
      if (o.isMesh && o.userData.ozelMalzeme && o.material.emissive){
        o.material.emissiveIntensity = o.userData.ozelMalzeme.emissiveIntensity;
      }
    });
    seciliParca = null;
  }
}
kartKapat.addEventListener('click', kartiKapat);

// İmleç değişimi (hover)
let hoverZaman = 0;
tuval.addEventListener('pointermove', (e) => {
  const simdi = performance.now();
  if (simdi - hoverZaman < 70) return;
  hoverZaman = simdi;
  fare.x = (e.clientX / window.innerWidth) * 2 - 1;
  fare.y = -(e.clientY / window.innerHeight) * 2 + 1;
  isinlayici.setFromCamera(fare, aktifKamera);
  const bulunan = isinlayici.intersectObjects(tiklanabilir, false);
  tuval.style.cursor = bulunan.length ? 'pointer' : 'grab';
});

tuval.addEventListener('pointerdown', (e) => {
  baslangicNoktasi = { x: e.clientX, y: e.clientY };
});

tuval.addEventListener('pointerup', (e) => {
  if (!baslangicNoktasi) return;
  const gecti = Math.hypot(e.clientX - baslangicNoktasi.x, e.clientY - baslangicNoktasi.y);
  baslangicNoktasi = null;
  if (gecti > 6) return; // sürükleme sayılır, tıklama değil

  fare.x = (e.clientX / window.innerWidth) * 2 - 1;
  fare.y = -(e.clientY / window.innerHeight) * 2 + 1;
  isinlayici.setFromCamera(fare, aktifKamera);
  const bulunan = isinlayici.intersectObjects(tiklanabilir, false);

  if (!bulunan.length){ kartiKapat(); return; }

  let hedef = bulunan[0].object;
  while (hedef && !hedef.userData.bilgi) hedef = hedef.parent;
  if (!hedef) return;

  if (seciliParca === hedef){ kartiKapat(); return; }
  if (seciliParca) kartiKapat();

  seciliParca = hedef;
  // Seçili parçayı hafifçe aydınlat
  hedef.traverse(o => {
    if (o.isMesh && o.material && o.material.emissive){
      o.userData.ozelMalzeme = { emissiveIntensity: o.material.emissiveIntensity };
      o.material.emissiveIntensity = o.userData.ozelMalzeme.emissiveIntensity + 0.35;
    }
  });
  kartiGoster(hedef.userData.bilgi);
});

// NUMEX-DÜZELTME (2026-10-22): Kök neden: yumuşak kamera geçişi (hedefKamera) kamera.position'a lerp yapıyordu; bu, yörünge kontrolünün her karede yazdığı konumla çakışıp kamerayı sürekli yarışa sokuyordu. Kontrol artık tek sahipli; kullanılmayan animasyon bloğu kaldırıldı.

let kareSayaci = 0;
let fpsZaman = performance.now();
let fps = 0;

function sayaciGuncelle(){
  kareSayaci++;
  const simdi = performance.now();
  const gecen = simdi - fpsZaman;
  if (gecen >= 500){
    fps = Math.round((kareSayaci * 1000) / gecen);
    kareSayaci = 0;
    fpsZaman = simdi;
    pFps.textContent = fps;
    pUcgen.textContent = cizici.info.render.triangles.toLocaleString('tr-TR');
    pCizim.textContent = cizici.info.render.calls;

}

   BÖLÜMLER · Genel Bakış / Yapı / Fırlatma

/* ---- Ölçü çizgileri (Yapı bölümü) ---- */

// Roketin gerçek sınırları (roket grubu y=11'de, gövde 0..40, koni 40..49, motor -6..0)
const ROKET_ALT = 11 - 7.4;    // nozul ucu
const ROKET_UST = 11 + 49.4;   // koni ucu
const ROKET_YARICAP = 3.1;     // motor bölümü yarıçapı (en geniş)

const olcuBoy = olcuCizgisiOlustur('dikey');
const olcuBoyUst = olcuUcuOlustur();

const v3 = new THREE.Vector3();
function dunyadanEkrana(x, y, z){
  v3.set(x, y, z).project(aktifKamera);
  return {
    x: (v3.x * 0.5 + 0.5) * innerWidth,
    y: (-v3.y * 0.5 + 0.5) * innerHeight,
    gorunur: v3.z < 1
  };
}

function olculeriGuncelle(goster){
  const gorunur = goster ? 1 : 0;
  const opaklik = String(gorunur);
  olcuKatman.style.opacity = opaklik;
  olcuKatman.style.transition = 'opacity .4s';
  if (!goster) return;

  // --- Boy ölçüsü: roketin sağında dikey çizgi ---
  const ust = dunyadanEkrana(ROKET_YARICAP + 4, ROKET_UST, 0);
  const alt = dunyadanEkrana(ROKET_YARICAP + 4, ROKET_ALT, 0);
  if (ust.gorunur && alt.gorunur){
    const x = ust.x;
    const y1 = Math.min(ust.y, alt.y);
    const y2 = Math.max(ust.y, alt.y);
    olcuBoy.style.left = x + 'px';
    olcuBoy.style.top = y1 + 'px';
    olcuBoy.style.height = (y2 - y1) + 'px';

    olcuBoyUst.style.left = x + 'px';
    olcuBoyUst.style.top = y1 + 'px';
    olcuBoyAlt.style.left = x + 'px';
    olcuBoyAlt.style.top = y2 + 'px';

    // Yatay kılavuz çizgiler
    olcuBoyEtiket.style.left = (x + 58) + 'px';
    olcuBoyEtiket.style.top = ((y1 + y2) / 2) + 'px';
  }

  // --- Çap ölçüsü: motor bölümü genişliği (yatay) ---
  const sol = dunyadanEkrana(-ROKET_YARICAP, ROKET_ALT + 2.2, 0);
  const sag = dunyadanEkrana(ROKET_YARICAP, ROKET_ALT + 2.2, 0);
  if (sol.gorunur && sag.gorunur){
    const y = sol.y;
    olcuCap.style.left = Math.min(sol.x, sag.x) + 'px';
    olcuCap.style.top = y + 'px';
    olcuCap.style.width = Math.abs(sag.x - sol.x) + 'px';

    olcuCapSol.style.left = sol.x + 'px';
    olcuCapSol.style.top = y + 'px';
    olcuCapSag.style.left = sag.x + 'px';
    olcuCapSag.style.top = y + 'px';

    olcuCapEtiket.style.left = ((sol.x + sag.x) / 2) + 'px';
    olcuCapEtiket.style.top = (y - 26) + 'px';
  }
}

/* ---- Yapı bölümü: parçalara ayrılma ----
   Roketin DOĞRUDAN çocuklarını (düz seviye) alır; her biri kendi
   yüksekliğine göre yukarı/aşağı kayar. Alt gruplara dokunmayız —
   traverse yerel konumlar karıştırıyordu. */
const YAPI_PARCA = [];
roket.children.forEach(o => {
  if (o.isMesh || o.isGroup){
    YAPI_PARCA.push({
      nesne: o,
      basY: o.position.y,
      basX: o.position.x,
      basZ: o.position.z,
      ad: (o.userData && o.userData.bilgi && o.userData.bilgi.ad) || o.type
    });
  }
});
// Gövde ana silindiri (cekirdek) tek parça ve en büyük; onu da listeye kat
if (!YAPI_PARCA.some(p => p.nesne === cekirdek)){
  YAPI_PARCA.push({ nesne: cekirdek, basY: cekirdek.position.y, basX: cekirdek.position.x, basZ: cekirdek.position.z, ad: 'Çekirdek gövde' });
}
// Yüksekliğe göre sırala: en üstteki en çok yükselsin
YAPI_PARCA.sort((a, b) => b.basY - a.basY);
console.info('[YAPI] parça sayısı:', YAPI_PARCA.length,
  YAPI_PARCA.slice(0, 8).map(p => p.basY.toFixed(1)));

let yapiOran = 0;       // 0..1 (parçalara ayrılma)
let yapiHedef = 0;

function yapiUygula(t){
  const n = Math.max(1, YAPI_PARCA.length);
  YAPI_PARCA.forEach((p, i) => {
    // Sırayla açılma (aşağıdan yukarı dalga)
    const gecikme = (i / n) * 0.45;
    const yerel = Math.min(1, Math.max(0, (t - gecikme) / (1 - gecikme || 1)));
    const yumusak = yerel * yerel * (3 - 2 * yerel);

    // Dikey açılma: her parça kendi yüksekliğinden uzağa, büyük parça çok açılır
    const merkezY = 22;
    const yon = p.basY >= merkezY ? 1 : -1;
    const mesafe = Math.abs(p.basY - merkezY) / merkezY;
    const miktar = 6 + mesafe * 16 + (p.nesne === cekirdek ? 4 : 0);
    p.nesne.position.y = p.basY + yon * yumusak * miktar;

    // Radyal açılma: parçalar gövdeden yanlara dağılır
    const aci = (i / n) * Math.PI * 2 + 0.6;
    const radyal = yumusak * (3.5 + (i % 5) * 1.8);
    p.nesne.position.x = p.basX + Math.cos(aci) * radyal;
    p.nesne.position.z = p.basZ + Math.sin(aci) * radyal;

    // Gövde dilimleri hafif yatsın (yapı sökülüyormuş hissi)
    if (p.nesne !== cekirdek){
      p.nesne.rotation.z = Math.sin(i) * yumusak * 0.12;
    }
  });
}

/* ---- Fırlatma bölümü: geri sayım → ateşleme → kalkış → ayrılma ---- */
let firlatmaAktif = false;
let firlatmaZaman = 0;
let kalkanRoketY = 11;

const ASAMALAR = [
  { t: 0.0,  ad: 'Hazırlık',            sayim: 'T-10' },
  { t: 3.0,  ad: 'Geri sayım',          sayim: 'T-7' },
  { t: 6.0,  ad: 'Servis kolları çekiliyor', sayim: 'T-4' },
  { t: 9.0,  ad: 'Ateşleme',            sayim: 'T-0' },
  { t: 11.0, ad: 'Kalkış',              sayim: 'T+2' },
  { t: 15.0, ad: 'Kademe ayrılması',    sayim: 'T+6' },
  { t: 19.0, ad: 'Yörüngeye oturma',    sayim: 'T+10' }
];

function firlatmaSifirla(){
  firlatmaAktif = false;
  firlatmaZaman = 0;
  kalkanRoketY = 11;
  roket.position.y = 11;
  roket.rotation.z = 0;
  geriSayimEl.textContent = 'T-10';
  asamaAdEl.textContent = 'Hazırlık';
  alevler.forEach(a => { a.visible = false; a.scale.setScalar(1); });
  servisKollari.forEach(k => { k.rotation.z = k.userData.kapali; });
  kademeAyrik.position.y = 0;
  yapiHedef = 0;
}

function firlatmaBaslat(){
  firlatmaSifirla();
  firlatmaAktif = true;
  firlatmaZaman = 0;
}

/* ---- ALEVLER: çekirdek + 4 booster nozulunun altında ---- */
const alevMal = new THREE.MeshBasicMaterial({
  color: 0xffb45a, transparent: true, opacity: 0.92,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const alevIcMal = new THREE.MeshBasicMaterial({
  color: 0xfff2d0, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false
});

const alevler = [];
function alevEkle(x, y, z, r){
  // Dış koni (turuncu)
  const dis = new THREE.Mesh(new THREE.ConeGeometry(r, 7, 16, 1, true), alevMal);
  dis.rotation.x = Math.PI;             // aşağı baksın
  dis.position.set(x, y - 3.5, z);
  dis.visible = false;
  roket.add(dis);
  alevler.push(dis);

  // İç koni (beyaz-sıcak)
  const ic = new THREE.Mesh(new THREE.ConeGeometry(r * 0.55, 4.5, 12, 1, true), alevIcMal);
  ic.rotation.x = Math.PI;
  ic.position.set(x, y - 2.4, z);
  ic.visible = false;
  roket.add(ic);
  alevler.push(ic);
}
// Çekirdek motor nozulları (roket içinde, y = -6.1)
for (let i = 0; i < 4; i++){
  const aci = (i / 4) * Math.PI * 2 + Math.PI / 4;
  alevEkle(Math.cos(aci) * 1.5, -6.1, Math.sin(aci) * 1.5, 0.9);
}
// Booster nozulları (roket içinde, y = 2.2)
for (let i = 0; i < 4; i++){
  const aci = (i / 4) * Math.PI * 2 + Math.PI / 4;
  alevEkle(Math.cos(aci) * 4.1, 2.2, Math.sin(aci) * 4.1, 1.05);
}

/* ---- SERVİS KOLLARI: kuleden rokete uzanan 3 kol ---- */
const servisKollari = [];
const kolMal = new THREE.MeshStandardMaterial({ color: 0x6b7684, roughness: 0.6, metalness: 0.75 });
[-22, -6, 10].forEach((y, i) => {
  const kol = new THREE.Group();
  kol.position.set(0, y, 0);   // kule grubuna göre (kule -17,3,-2'de)
  const govde = kutu(7, 0.55, 0.9, kolMal);
  govde.position.x = 3.5;
  kol.add(govde);
  kol.userData.kapali = 0;              // rokete uzanmış
  kol.userData.acik = -1.15 - i * 0.08; // geri çekilmiş
  kule.add(kol);
  servisKollari.push(kol);
});

/* ---- KADEME AYRILMASI: üst kademe + burun ayrı gruba ---- */
const kademeAyrik = new THREE.Group();
roket.add(kademeAyrik);
// NUMEX-DÜZELTME (2026-10-22): Kule sahnesi roketin yanında havada uçuyordu: bu blok roket.children içinden y>30 olan her şeyi kademeAyrik grubuna taşıyordu ve YAPI_PARCA listesini de bozuyordu. kademeAyrik zaten boş bir grup; ayrılma animasyonu roket.rotation ve pozisyonla sağlandığından bu taşıma gereksiz — kaldırıldı.
// Not: üst kademe ayrılması roket.rotation.z + kademeAyrik konumu ile
// canlandırılıyor. Parçaları gruplar arasında taşımıyoruz — bu, sahnenin
// diğer nesnelerini (kule, küreler) yanlışlıkla rokete bağlıyordu.

function firlatmaGuncelle(dt){
  if (!firlatmaAktif) return;
  firlatmaZaman += dt;

  // Aşama metni
  let asama = ASAMALAR[0];
  for (const a of ASAMALAR){
    if (firlatmaZaman >= a.t) asama = a;
  }
  asamaAdEl.textContent = asama.ad;
  const kalan = Math.max(0, 10 - firlatmaZaman);
  geriSayimEl.textContent = firlatmaZaman < 10
    ? 'T-' + Math.ceil(kalan)
    : 'T+' + Math.floor(firlatmaZaman - 10);

  // Servis kolları 6-9 sn arası çekilir
  const kolOran = Math.min(1, Math.max(0, (firlatmaZaman - 6) / 3));
  servisKollari.forEach((k, i) => {
    const yerel = Math.min(1, Math.max(0, (kolOran - i * 0.12) / 0.7));
    const yumusak = yerel * yerel * (3 - 2 * yerel);
    k.rotation.z = k.userData.kapali + (k.userData.acik - k.userData.kapali) * yumusak;
  });

  // Ateşleme: 9 sn'den sonra alev
  if (firlatmaZaman >= 9){
    const guc = Math.min(1, (firlatmaZaman - 9) / 1.5);
    alevler.forEach((a, i) => {
      a.visible = true;
      const titresim = 1 + Math.sin(firlatmaZaman * 34 + i) * 0.12;
      a.scale.set(guc * titresim, guc * (1.6 + Math.min(2.2, (firlatmaZaman - 9) * 0.8)) * titresim, guc * titresim);
    });
  }

  // Kalkış: 11 sn'den sonra yüksel
  if (firlatmaZaman >= 11){
    const y = Math.min(1, (firlatmaZaman - 11) / 4);
    kalkanRoketY = 11 + y * y * 150;
  }
  roket.position.y = kalkanRoketY;

  // Kamera roketi takip etsin (kalkıştan sonra yukarı kaydır)
  if (firlatmaZaman >= 11){
    // NUMEX-DÜZELTME (2026-10-22): Kalkışta roket kadrajdan taşıyordu (burun üstten kesik): roket 150 birim yükselirken kamera yalnız 42 birim uzaklaşıyordu. Takip mesafesini yükselişle orantılı hale getirdim (96 + yükseliş*1.15) — roket hızla uzaklaşsa bile kadrajda kalır.
    const yukselis = kalkanRoketY - 11;                 // 0 → 150
    // NUMEX-DÜZELTME (2026-10-22): Kalkış takibi roketi ekranın %20'sine küçültüyor ve rampayı kadrajdan tamamen çıkarıyordu (hedef hem çok yukarı hem çok uzak). Takibi roketin yükselişinin ~%55'i kadar yukarı kaldırıp mesafeyi 96→118 aralığında tuttum; böylece roket %40 dolulukta kalır ve rampa altta referans olarak görünmeye devam eder.
    // NUMEX-DÜZELTME (2026-10-22): Kamera takibi roketi kaçırıyordu (T+9'da roket ekran tepesinden çıkıyordu): hedef yalnız yükselişin %55'ini izliyordu. Hedefi roketin GERÇEK konumuna bağladım; roket artık kadrajdan çıkamaz.
    // Hedef = roketin gerçek konumu (gövde ortası); roket asla kadrajdan çıkmaz
    const hedefY = kalkanRoketY + 14;
    kontroller.hedef.y += (hedefY - kontroller.hedef.y) * Math.min(1, dt * 4.0);
    // Mesafe roket rahat sığacak kadar artsın, aşırı uzaklaşma yok
    kontroller.hedefMesafe = Math.min(135, 96 + yukselis * 0.22);
  }

  // Kademe ayrılması: 15 sn'den sonra — ayrılan parçalar yana savrulur
  if (firlatmaZaman >= 15){
    const y = Math.min(1, (firlatmaZaman - 15) / 3.5);
    const yumusak = y * y * (3 - 2 * y);
    kademeAyrik.position.y = -yumusak * 18;             // aşağıda kalır
    kademeAyrik.position.x = yumusak * 9;               // yana kayar
    kademeAyrik.position.z = yumusak * 5;
    kademeAyrik.rotation.z = -yumusak * 0.32;           // yatıp savrulur
    roket.rotation.z = yumusak * 0.06;
  }

  if (firlatmaZaman > 22) firlatmaAktif = false;
}

/* ---- Bölüm değiştirme ---- */
function bolumSec(yeni){
  bolum = yeni;
  SEKMELER.forEach(s => s.classList.toggle('aktif', s.dataset.bolum === yeni));

  firlatmaPanel.classList.toggle('acik', yeni === 'firlatma');
  olcuKatman.style.display = (yeni === 'yapi') ? 'block' : 'none';

  if (yeni === 'yapi'){
    // NUMEX-DÜZELTME (2026-10-22): Yapı bölümü hiç açılmıyordu: yapiHedef=1 atanıyordu ama hemen ardından çağrılan firlatmaSifirla() içinde yapiHedef=0 yapılıyordu (satır 1554), yani hedef hep sıfıra dönüyordu. Sıra düzeltildi: önce sıfırla, sonra hedefi ata.
    firlatmaSifirla();   // önce temizle (yapiHedef'i 0 yapar)
    yapiHedef = 1;       // SONRA hedefi ata — sıra önemli
  } else if (yeni === 'genel'){
    yapiHedef = 0;
    firlatmaSifirla();
  } else if (yeni === 'firlatma'){
    yapiHedef = 0;
    firlatmaBaslat();
  }
}

SEKMELER.forEach(s => s.addEventListener('click', () => bolumSec(s.dataset.bolum)));

/* =========================================================
   YÜKLENİYOR EKRANI + DÖNGÜ
   ========================================================= */
window.addEventListener('resize', () => {
  // NUMEX-DÜZELTME (2026-10-22): Pencere boyutu değişince tuval yine sabit pencere ölçüsüne dönüyordu; artık CSS kutusundan ölçülen tek fonksiyon kullanılıyor.
  kamera.aspect = window.innerWidth / window.innerHeight;
  kamera.updateProjectionMatrix();
  kameraBoyutla();
  tuvalBoyutla();
});

const saat = new THREE.Clock();

function dongu(){
  requestAnimationFrame(dongu);
  const dt = saat.getDelta();

  // NUMEX-DÜZELTME (2026-10-22): Kök neden: kaldırılan hedefKamera değişkenine döngüde hâlâ başvuruluyordu — tanımsız değişken ReferenceError fırlatıp animasyon döngüsünü her karede kırardı.
  // (kamera konumu kontroller.update içinde tek noktadan yönetilir)

  kontroller.update();

  // Bölüm animasyonları
  firlatmaGuncelle(dt);
  yapiOran += (yapiHedef - yapiOran) * Math.min(1, dt * 3.2);
  if (bolum === 'yapi') yapiUygula(yapiOran);
  olculeriGuncelle(bolum === 'yapi');

  // ÖLÇÜM (geçici): bölüm ve parça sayısını bir kez yazdır
  if (!window.__numexOlcum){
    window.__numexOlcum = true;
    console.info('[YAPI] bolum=' + bolum + ' parca=' + YAPI_PARCA.length +
      ' oran=' + yapiOran.toFixed(2) + ' hedef=' + yapiHedef.toFixed(2));
  }

  // Rüzgârda ağır ağır salınan yıldız ışığı hissi için hafif ışık titremesi
  const t = saat.getElapsedTime();
  gunes.intensity *= 1 + Math.sin(t * 0.4) * 0.004;

  // Yükselti etkisi: bulut düzlemini çok yavaş kaydır
  if (bulutlar){
    bulutlar.rotation.y = t * 0.004;
  }

  cizici.render(sahne, aktifKamera);
  sayaciGuncelle();
}

setTimeout(() => {
  const yuk = document.getElementById('yukleniyor');
  if (yuk){
    yuk.style.opacity = '0';
    setTimeout(() => yuk.remove(), 700);
  }
}, 600);

dongu();
